

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #10131f, #20283d);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .calculator {
            width: 340px;
            max-width: 100%;
            padding: 25px;
            border-radius: 25px;
            background: #171c2b;
            box-shadow: 0 20px 50px #0008;
        }

        h2 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        #display {
            width: 100%;
            height: 85px;
            margin-bottom: 20px;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #0d1220;
            color: white;
            font-size: 32px;
            text-align: right;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 58px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: #293248;
            transition: 0.2s;
        }

        button:hover {
            filter: brightness(1.3);
            transform: translateY(-2px);
        }

        .operator {
            background: #ff9f43;
            color: #171c2b;
        }

        .utility {
            background: #46516b;
        }

        .equals {
            background: #22c997;
            color: #10131f;
        }

        .zero {
            grid-column: span 2;
        }

        p {
            text-align: center;
            color: #9ba8c3;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>CALCULATOR</h2>

        <input id="display" value="0" readonly
               aria-label="Calculator display">

        <div class="buttons">
            <button class="utility" onclick="clearDisplay()">AC</button>
            <button class="utility" onclick="backspace()">DEL</button>
            <button class="utility" onclick="percent()">%</button>
            <button class="operator" onclick="choose('/')">÷</button>

            <button onclick="number('7')">7</button>
            <button onclick="number('8')">8</button>
            <button onclick="number('9')">9</button>
            <button class="operator" onclick="choose('*')">×</button>

            <button onclick="number('4')">4</button>
            <button onclick="number('5')">5</button>
            <button onclick="number('6')">6</button>
            <button class="operator" onclick="choose('-')">−</button>

            <button onclick="number('1')">1</button>
            <button onclick="number('2')">2</button>
            <button onclick="number('3')">3</button>
            <button class="operator" onclick="choose('+')">+</button>

            <button class="zero" onclick="number('0')">0</button>
            <button onclick="decimal()">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>

        
    </div>

    <script>
        const display = document.getElementById("display");

        let current = "0";
        let previous = null;
        let operator = null;
        let resetNext = false;

        function update() {
            display.value = current;
        }

        function number(n) {
            if (resetNext || current === "Error") {
                current = n;
                resetNext = false;
            } else if (current === "0") {
                current = n;
            } else if (current.length < 15) {
                current += n;
            }
            update();
        }

        function decimal() {
            if (resetNext || current === "Error") {
                current = "0";
                resetNext = false;
            }

            if (!current.includes(".")) {
                current += ".";
            }
            update();
        }

        function choose(op) {
            if (current === "Error") return;

            if (operator && !resetNext) {
                calculate();
            }

            previous = Number(current);
            operator = op;
            resetNext = true;
        }

        function calculate() {
            if (operator === null || previous === null) return;

            const a = previous;
            const b = Number(current);
            let result;

            switch (operator) {
                case "+":
                    result = a + b;
                    break;
                case "-":
                    result = a - b;
                    break;
                case "*":
                    result = a * b;
                    break;
                case "/":
                    if (b === 0) {
                        current = "Error";
                        previous = null;
                        operator = null;
                        resetNext = true;
                        update();
                        return;
                    }
                    result = a / b;
                    break;
            }

            current = String(Number(result.toPrecision(12)));
            previous = null;
            operator = null;
            resetNext = true;
            update();
        }

        function clearDisplay() {
            current = "0";
            previous = null;
            operator = null;
            resetNext = false;
            update();
        }

        function backspace() {
            if (resetNext || current === "Error") {
                current = "0";
                resetNext = false;
            } else {
                current = current.length > 1
                    ? current.slice(0, -1)
                    : "0";
            }
            update();
        }

        function percent() {
            if (current !== "Error") {
                current = String(Number(current) / 100);
                resetNext = true;
                update();
            }
        }

        document.addEventListener("keydown", function(event) {
            const key = event.key;

            if (/^[0-9]$/.test(key)) number(key);
            else if (key === ".") decimal();
            else if (["+", "-", "*", "/"].includes(key)) choose(key);
            else if (key === "Enter" || key === "=") calculate();
            else if (key === "Backspace") backspace();
            else if (key === "Escape") clearDisplay();
            else if (key === "%") percent();
        });
    </script>

</body>
</html>
